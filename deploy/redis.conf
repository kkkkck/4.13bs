# ================================================
# Redis 配置文件
# ================================================

# 绑定地址（允许所有IP访问）
bind 0.0.0.0

# 端口
port 6379

# 守护进程模式
daemonize yes

# 日志文件路径
logfile "/var/log/redis/redis-server.log"

# 数据库数量
databases 16

# 设置密码（请修改为您的密码）
requirepass your_redis_password

# 最大内存限制
maxmemory 512mb

# 内存淘汰策略
maxmemory-policy allkeys-lru

# 持久化配置
save 900 1
save 300 10
save 60 10000

# AOF持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# TCP连接保活
tcp-keepalive 300

# 超时时间（0表示不超时）
timeout 0